name: Build and deploy Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout playground
        uses: actions/checkout@v4
        with:
          path: app
      - name: Read pinned RustScript revision
        id: rustscript_rev
        run: |
          rev="$(tr -d '[:space:]' < app/scripts/rustscript-core-revision)"
          echo "rev=${rev}" >> "$GITHUB_OUTPUT"
      - name: Checkout RustScript
        uses: actions/checkout@v4
        with:
          repository: rustscript-lang/rustscript
          ref: ${{ steps.rustscript_rev.outputs.rev }}
          path: rustscript
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.9
      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: app
      - name: Build playground wasm
        run: bun run build:wasm-playground
        working-directory: app
        env:
          RUSTSCRIPT_REPO: ${{ github.workspace }}/rustscript
          RUSTSCRIPT_CORE_REV: ${{ steps.rustscript_rev.outputs.rev }}
      - name: Test
        run: bun test
        working-directory: app
      - name: Typecheck
        run: bunx tsc --noEmit
        working-directory: app
      - name: Vite production build
        run: bunx vite build
        working-directory: app
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: app/dist
          cname: playground.rustscript.org
          force_orphan: true
